[package]
name = "monitor-agent"
version = "1.1.16"
edition = "2021"
license = "MIT"
description = "Linux monitoring agent for the monitor hub"
repository = "https://github.com/monitor-probe/agent"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A single-threaded runtime suffices: one report every few seconds plus a
# handful of TCP probes.
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util"] }
rustix = { version = "1", features = ["fs"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# tokio-tungstenite 0.28 leaves the crypto provider to the caller: rustls
# selects one automatically only when exactly one provider feature is enabled.
# Without this the agent panics on its first wss:// connection.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# 流媒体探测要**从节点自己发出 HTTPS GET** ✓（这是这一块唯一的新能力 ✓）。
# ⚠️ 这两个**本来就在 Cargo.lock 里**（是 tokio-tungstenite 的传递依赖 ✓）⇒
# 这里只是把它们变成**直接**依赖 ✓ —— 版本照锁文件写 ✓，不引入新东西 ✓。
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# ICMP echo sockets. Already in the tree as a tokio dependency, so this adds no
# crate to build; the raw socket path is the fallback for hosts that refuse an
# unprivileged datagram one.
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15.0"
minisign-verify = "0.3.0"

[dev-dependencies]
# Only the tests need a movable clock; the write-deadline arithmetic spans
# minutes. dev-dependencies do not reach the shipped binary.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
