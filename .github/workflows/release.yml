name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7
      # A v* tag can be neither moved nor deleted, so one that disagrees with the
      # version the agent reports stops here, before anything is published.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ "$GITHUB_REF_NAME" = "$V" ] || { echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $V"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo install --locked cross
      - run: cross build --release --locked --target ${{ matrix.target }}
      # install.sh downloads exactly this name; changing it breaks every
      # install command the hub issues.
      - run: cp "target/${{ matrix.target }}/release/monitor-agent" "monitor-agent-${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: monitor-agent-${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-latest
    # 签名要用仓库 Secret，而 Secret 的安全性 = "谁能在这个仓库里让代码跑起来"。
    # 绑到 Environment 并设**必需审阅人**之后，即使有人改了 workflow，签名这一步也要人点一下。
    environment: release
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      # A manual dispatch builds and collects the binaries; only a tag publishes,
      # so the path can be exercised without cutting a release. gh ships on the
      # runner, keeping a third-party action out of the contents:write step.
      # sha256sums.txt is generated from a directory holding only the binaries,
      # so the names in it are bare. The hub relays these through an
      # operator-configured GitHub proxy and install.sh executes what arrives,
      # so a published digest is the only material available to verify them.
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          MINISIGN_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
        run: |
          mkdir -p bin && mv monitor-agent-* bin/
          # **没有密钥就直接失败** —— 绝不能出现"发了版但没签名"的情况：
          # agent 侧校验不过，等于这次发布对远程升级毫无意义，而人却以为签过了。
          [ -n "$MINISIGN_KEY" ] || { echo "::error::缺少 AGENT_SIGNING_KEY，拒绝发布未签名的版本"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          # 私钥只落在临时文件里，`trap` 保证这一步退出即删（不给后续步骤留念想）。
          KEY=$(mktemp); trap 'rm -f "$KEY"' EXIT
          printf '%s' "$MINISIGN_KEY" > "$KEY"
          cd bin
          # **直接签二进制**（不是签一份清单）：agent 收到的字节本身就是被签的对象，
          # 于是不存在"清单与文件对不上"的中间环节。
          for f in monitor-agent-*; do
            minisign -S -s "$KEY" -m "$f" -t "monitor-agent $GITHUB_REF_NAME"
          done
          sha256sum monitor-agent-* > sha256sums.txt
          gh release create "$GITHUB_REF_NAME" monitor-agent-* *.minisig sha256sums.txt \
            --generate-notes --repo "$GITHUB_REPOSITORY"
